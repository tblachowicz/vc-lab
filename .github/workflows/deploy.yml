# Deploys VC Lab on every push to main, all three apps as Cloudflare Workers on custom domains:
#   issuer   -> vc-issuer.loft70.pro
#   wallet   -> vc-wallet.loft70.pro   (static assets only)
#   verifier -> vc-verifier.loft70.pro
# The hostnames are also the "routes" in deploy/*.jsonc; change both together.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and loft70.pro as a zone on that account.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ISSUER_URL: https://vc-issuer.loft70.pro
  WALLET_URL: https://vc-wallet.loft70.pro
  VERIFIER_URL: https://vc-verifier.loft70.pro

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README, Deploy)."
            exit 1
          fi
          verify=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$(jq -r '.success' <<<"$verify")" != "true" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN: $(jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")' <<<"$verify")"
            exit 1
          fi

      - name: Build static files
        run: node scripts/build.js

      - name: Deploy the issuer
        run: npx wrangler deploy -c deploy/issuer.jsonc --var "WALLET_URL:$WALLET_URL" --var "ISSUER_URL:$ISSUER_URL"

      - name: Deploy the verifier
        run: npx wrangler deploy -c deploy/verifier.jsonc --var "WALLET_URL:$WALLET_URL" --var "ISSUER_URL:$ISSUER_URL" --var "VERIFIER_URL:$VERIFIER_URL"

      - name: Deploy the wallet
        run: npx wrangler deploy -c deploy/wallet.jsonc

      - name: Smoke test
        run: |
          # A brand-new custom domain can take a minute to get its certificate.
          for url in "$ISSUER_URL/.well-known/openid-credential-issuer" "$WALLET_URL/offer" "$VERIFIER_URL/"; do
            curl -fsS -o /dev/null --retry 10 --retry-delay 6 --retry-all-errors "$url"
          done
          {
            echo "| App | URL |"
            echo "|-----|-----|"
            echo "| Issuer | $ISSUER_URL |"
            echo "| Wallet | $WALLET_URL |"
            echo "| Verifier | $VERIFIER_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
