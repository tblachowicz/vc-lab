# Deploys VC Lab on every push to main:
#   issuer   -> Cloudflare Worker  vc-lab-issuer.<subdomain>.workers.dev
#   verifier -> Cloudflare Worker  vc-lab-verifier.<subdomain>.workers.dev
#   wallet   -> GitHub Pages       <owner>.github.io/<repo>
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and Pages set to "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Work out the public URLs
        id: urls
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README, Deploy)."
            exit 1
          fi
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          # Cloudflare's error messages name the problem (bad token, wrong account, no subdomain) without echoing secrets.
          errors() { jq -r '[.errors[]? | "\(.code): \(.message)"] | join("; ")'; }
          verify=$(cf /user/tokens/verify)
          if [ "$(jq -r '.success' <<<"$verify")" != "true" ]; then
            echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN: $(errors <<<"$verify")"
            exit 1
          fi
          resp=$(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          sub=$(jq -r '.result.subdomain // empty' <<<"$resp")
          if [ -z "$sub" ]; then
            echo "::error::No workers.dev subdomain for this account ($(errors <<<"$resp")). Check that CLOUDFLARE_ACCOUNT_ID is the 32-character ID from the dashboard URL, and that Workers & Pages shows a workers.dev subdomain."
            exit 1
          fi
          {
            echo "issuer=https://vc-lab-issuer.$sub.workers.dev"
            echo "verifier=https://vc-lab-verifier.$sub.workers.dev"
            echo "wallet=${{ steps.pages.outputs.base_url }}"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Build static files
        run: node scripts/build.js
        env:
          ISSUER_URL: ${{ steps.urls.outputs.issuer }}
          VERIFIER_URL: ${{ steps.urls.outputs.verifier }}
          WALLET_URL: ${{ steps.urls.outputs.wallet }}

      - name: Deploy the issuer
        run: >-
          npx wrangler deploy -c deploy/issuer.jsonc
          --var "WALLET_URL:${{ steps.urls.outputs.wallet }}"
          --var "ISSUER_URL:${{ steps.urls.outputs.issuer }}"

      - name: Deploy the verifier
        run: >-
          npx wrangler deploy -c deploy/verifier.jsonc
          --var "WALLET_URL:${{ steps.urls.outputs.wallet }}"
          --var "ISSUER_URL:${{ steps.urls.outputs.issuer }}"
          --var "VERIFIER_URL:${{ steps.urls.outputs.verifier }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wallet

      - name: Deploy the wallet to GitHub Pages
        id: pages-deploy
        uses: actions/deploy-pages@v4

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 3 "${{ steps.urls.outputs.issuer }}/.well-known/openid-credential-issuer" > /dev/null
          curl -fsS --retry 5 --retry-delay 3 "${{ steps.urls.outputs.verifier }}/" > /dev/null
          {
            echo "| App | URL |"
            echo "|-----|-----|"
            echo "| Issuer | ${{ steps.urls.outputs.issuer }} |"
            echo "| Wallet | ${{ steps.urls.outputs.wallet }} |"
            echo "| Verifier | ${{ steps.urls.outputs.verifier }} |"
          } >> "$GITHUB_STEP_SUMMARY"
